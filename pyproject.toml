[tool.pytest.ini_options]
# Add each project's src/ here so tests can `import` its modules.
pythonpath = ["01-linear-regression/src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/run_experiment.py" = ["E402"]  # matplotlib.use("Agg") must run before pyplot is imported
